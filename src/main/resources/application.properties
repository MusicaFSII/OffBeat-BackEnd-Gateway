spring.application.name=OffBeatGetway

server.port=8080

spring.cloud.gateway.routes[0].id=productos
spring.cloud.gateway.routes[0].uri=http://localhost:8082
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/productos/**

spring.cloud.gateway.routes[1].id=categorias
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/categorias/**

spring.cloud.gateway.routes[2].id=blogs
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/blogs/**

spring.cloud.gateway.routes[3].id=usuarios
spring.cloud.gateway.routes[3].uri=http://localhost:8081
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/usuarios/**