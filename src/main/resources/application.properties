server.port=8080
spring.application.name=offbeatgateway

#RUTAS (en Docker usan el nombre del servicio; para correr local sin Docker, define las variables *_URL)
spring.cloud.gateway.server.webflux.routes[0].id=productos
spring.cloud.gateway.server.webflux.routes[0].uri=${PRODUCTOS_URL:http://productos:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0].name=Path
spring.cloud.gateway.server.webflux.routes[0].predicates[0].args.patterns=/api/v1/productos/**

spring.cloud.gateway.server.webflux.routes[1].id=categorias
spring.cloud.gateway.server.webflux.routes[1].uri=${PRODUCTOS_URL:http://productos:8081}
spring.cloud.gateway.server.webflux.routes[1].predicates[0].name=Path
spring.cloud.gateway.server.webflux.routes[1].predicates[0].args.patterns=/api/v1/categorias/**

spring.cloud.gateway.server.webflux.routes[2].id=usuarios
spring.cloud.gateway.server.webflux.routes[2].uri=${USUARIOS_URL:http://usuarios:8082}
spring.cloud.gateway.server.webflux.routes[2].predicates[0].name=Path
spring.cloud.gateway.server.webflux.routes[2].predicates[0].args.patterns=/api/v1/usuarios/**

spring.cloud.gateway.server.webflux.routes[3].id=comentarios
spring.cloud.gateway.server.webflux.routes[3].uri=${USUARIOS_URL:http://usuarios:8082}
spring.cloud.gateway.server.webflux.routes[3].predicates[0].name=Path
spring.cloud.gateway.server.webflux.routes[3].predicates[0].args.patterns=/api/v1/comentarios/**

spring.cloud.gateway.server.webflux.routes[4].id=compras
spring.cloud.gateway.server.webflux.routes[4].uri=${COMPRAS_URL:http://compras:8083}
spring.cloud.gateway.server.webflux.routes[4].predicates[0].name=Path
spring.cloud.gateway.server.webflux.routes[4].predicates[0].args.patterns=/api/v1/compras/**

spring.cloud.gateway.server.webflux.routes[5].id=blogs
spring.cloud.gateway.server.webflux.routes[5].uri=${BLOGS_URL:http://blogs:8084}
spring.cloud.gateway.server.webflux.routes[5].predicates[0].name=Path
spring.cloud.gateway.server.webflux.routes[5].predicates[0].args.patterns=/api/v1/blogs/**

#CORS
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=false
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=3600

#JWT (mismo valor que el servicio de usuarios)
jwt.secret=${JWT_SECRET}